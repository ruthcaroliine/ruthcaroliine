<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EC6FF"/>
      <stop offset="100%" stop-color="#B9E4FF"/>
    </linearGradient>
    <linearGradient id="hill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7FD858"/>
      <stop offset="100%" stop-color="#5AB33E"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF6EC7"/>
    </linearGradient>
    <linearGradient id="avatarBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A3B5E"/>
      <stop offset="100%" stop-color="#4F2140"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#sky)"/>
  <ellipse cx="950" cy="70" rx="90" ry="28" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="1030" cy="90" rx="70" ry="22" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="150" cy="50" rx="70" ry="20" fill="#ffffff" opacity="0.7"/>
  <rect x="0" y="520" width="1200" height="80" fill="url(#hill)"/>

  <!-- ============ MAIN PROFILE WINDOW ============ -->
  <g>
    <rect x="40" y="60" width="660" height="430" fill="#dbe9ff" stroke="#2b2b55" stroke-width="3"/>
    <rect x="40" y="60" width="660" height="46" fill="url(#titlebar)"/>
    <rect x="60" y="72" width="50" height="22" rx="3" fill="#f5f5f5" stroke="#2b2b55" stroke-width="2"/>
    <text x="70" y="88" font-family="Courier New, monospace" font-size="14" fill="#7a4fd1">R</text>
    <text x="125" y="90" font-family="Courier New, monospace" font-size="22" fill="#ffffff" font-weight="bold">ruthcaroliine</text>
    <circle cx="638" cy="83" r="9" fill="#f5f5f5" stroke="#2b2b55" stroke-width="2"/>
    <circle cx="665" cy="83" r="9" fill="#f5f5f5" stroke="#2b2b55" stroke-width="2"/>
    <circle cx="692" cy="83" r="9" fill="#FF4D6D" stroke="#2b2b55" stroke-width="2"/>

    <!-- avatar panel -->
    <rect x="56" y="122" width="240" height="300" fill="#e9e9e9" stroke="#2b2b55" stroke-width="2"/>
    <!-- custom avatar image (embedded as base64 so it always renders, no external file needed) -->
    <image href="data:image/png;base64," xlink:href="data:image/png;base64," x="76" y="122" width="200" height="230" preserveAspectRatio="xMidYMid meet"/>
    <text x="176" y="410" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#2b2b55">All Programs ▶</text>

    <!-- stats panel -->
    <g font-family="Courier New, monospace" font-size="16" fill="#1a1a3d" font-weight="bold">
      <text x="320" y="155">◆ LVL 22 — AI/ML Engineer</text>
      <text x="320" y="190">◆ CS Undergrad, VIT-AP</text>
      <text x="320" y="225">◆ Ex-Intern @ Quiddity</text>
      <text x="320" y="260">◆ Focus: Agentic Systems &amp; RAG</text>
    </g>
    <text x="320" y="310" font-family="Courier New, monospace" font-size="15" fill="#2b2b55">a builder who wants to know</text>
    <text x="320" y="332" font-family="Courier New, monospace" font-size="15" fill="#2b2b55">why things fail, not just that</text>
    <text x="320" y="354" font-family="Courier New, monospace" font-size="15" fill="#2b2b55">they did</text>
    <text x="320" y="385" font-family="Courier New, monospace" font-size="22" fill="#FF4D6D">♥</text>

    <!-- bottom buttons -->
    <rect x="120" y="440" width="180" height="34" rx="4" fill="#c9a24a" stroke="#2b2b55" stroke-width="2"/>
    <text x="145" y="462" font-family="Courier New, monospace" font-size="14" fill="#2b1a00" font-weight="bold">▶ View Projects</text>
    <rect x="330" y="440" width="150" height="34" rx="4" fill="#c94a4a" stroke="#2b2b55" stroke-width="2"/>
    <text x="358" y="462" font-family="Courier New, monospace" font-size="14" fill="#fff" font-weight="bold">⏻ Contact</text>
  </g>

  <!-- ============ FLOATING WINDOW: currently.exe ============ -->
  <g>
    <rect x="720" y="80" width="320" height="60" fill="#dbe9ff" stroke="#2b2b55" stroke-width="2"/>
    <rect x="720" y="80" width="320" height="34" fill="url(#titlebar)"/>
    <text x="732" y="102" font-family="Courier New, monospace" font-size="15" fill="#ffffff" font-weight="bold">new.exe</text>
    <circle cx="1005" cy="97" r="7" fill="#f5f5f5" stroke="#2b2b55" stroke-width="1.5"/>
    <circle cx="1025" cy="97" r="7" fill="#FF4D6D" stroke="#2b2b55" stroke-width="1.5"/>
  </g>

  <!-- ============ FLOATING WINDOW: building.exe ============ -->
  <g>
    <rect x="760" y="130" width="320" height="230" fill="#dbe9ff" stroke="#2b2b55" stroke-width="2"/>
    <rect x="760" y="130" width="320" height="34" fill="url(#titlebar)"/>
    <text x="770" y="152" font-family="Courier New, monospace" font-size="14" fill="#ffffff" font-weight="bold">currently_building.exe</text>
    <circle cx="1035" cy="147" r="7" fill="#f5f5f5" stroke="#2b2b55" stroke-width="1.5"/>
    <circle cx="1055" cy="147" r="7" fill="#FF4D6D" stroke="#2b2b55" stroke-width="1.5"/>
    <g font-family="Courier New, monospace" font-size="17" fill="#1a1a3d">
      <text x="776" y="185" font-size="15">self-correcting code agents</text>
      <text x="776" y="212" font-size="15">docker sandboxes</text>
      <text x="776" y="239" font-size="15">retrieval pipelines</text>
      <text x="776" y="266" font-size="15">retry &amp; validation logic</text>
      <text x="776" y="293" font-size="15">multilingual RAG</text>
      <text x="776" y="320" font-size="15">structure-aware chunking</text>
    </g>
  </g>

  <!-- ============ FLOATING WINDOW: always.exe ============ -->
  <g>
    <rect x="720" y="380" width="320" height="200" fill="#dbe9ff" stroke="#2b2b55" stroke-width="2"/>
    <rect x="720" y="380" width="320" height="34" fill="url(#titlebar)"/>
    <text x="730" y="402" font-family="Courier New, monospace" font-size="14" fill="#ffffff" font-weight="bold">always_debugging.exe</text>
    <circle cx="1005" cy="397" r="7" fill="#f5f5f5" stroke="#2b2b55" stroke-width="1.5"/>
    <circle cx="1025" cy="397" r="7" fill="#FF4D6D" stroke="#2b2b55" stroke-width="1.5"/>
    <g font-family="Courier New, monospace" font-size="17" fill="#1a1a3d">
      <text x="736" y="435">silent failures</text>
      <text x="736" y="462">flaky edge cases</text>
      <text x="736" y="489">off-by-one errors</text>
      <text x="736" y="516" font-size="15">"it worked on my machine"</text>
    </g>
  </g>

  <!-- ============ TASKBAR ============ -->
  <g>
    <rect x="0" y="560" width="1200" height="40" fill="#1a1a3d"/>
    <rect x="10" y="566" width="110" height="28" rx="4" fill="#5AB33E"/>
    <text x="30" y="586" font-family="Courier New, monospace" font-size="16" fill="#ffffff" font-weight="bold">Start</text>
    <rect x="140" y="568" width="110" height="24" fill="#2e2e5e"/>
    <text x="148" y="585" font-family="Courier New, monospace" font-size="12" fill="#dbe9ff">new.exe</text>
    <rect x="260" y="568" width="180" height="24" fill="#2e2e5e"/>
    <text x="268" y="585" font-family="Courier New, monospace" font-size="12" fill="#dbe9ff">currently_building.exe</text>
    <rect x="450" y="568" width="170" height="24" fill="#2e2e5e"/>
    <text x="458" y="585" font-family="Courier New, monospace" font-size="12" fill="#dbe9ff">always_debugging.exe</text>
  </g>
</svg>
